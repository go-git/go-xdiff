name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [oldstable, stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ matrix.go }}
      - name: Format and vet
        shell: bash
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go vet -C benchmarks ./...
      - name: Pure-Go tests
        shell: bash
        run: |
          go test ./...
          go test -C benchmarks ./...
        env:
          CGO_ENABLED: "0"
      - name: Reference comparisons
        if: runner.os != 'Windows'
        run: go test -count=1 ./...
        env:
          CGO_ENABLED: "0"
          GO_XDIFF_TESTREF: "1"
      - name: Race checks
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: WebAssembly build
        if: runner.os == 'Linux'
        run: |
          GOOS=js GOARCH=wasm go build ./...
          GOOS=wasip1 GOARCH=wasm go build ./...
        env:
          CGO_ENABLED: "0"
